[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-agent"
version = "0.2.0"
description = "Scope-aware decision propagation inconsistency detection agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "scikit-learn>=1.4",
  "streamlit>=1.36",
  "pandas>=2.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "anthropic>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
desktop = [
  "watchdog>=4.0",
  "pystray>=0.19",
  "pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "keyring>=25.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-pptx>=0.6.23",
  "beautifulsoup4>=4.12",
  "winotify>=1.1; sys_platform == 'win32'",
  "pywebview>=5.0; sys_platform == 'win32'",
]
build = ["pyinstaller>=6.6"]
uicheck = ["playwright>=1.40"]

[project.scripts]
decision-agent = "decision_agent.desktop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"decision_agent.desktop" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
